services:
  falkordb:
    image: falkordb/falkordb:v4.22.1
    ports:
      - "127.0.0.1:6380:6379"
      - "127.0.0.1:3001:3000"
    volumes:
      - returntrace_graph:/var/lib/falkordb/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  returntrace_graph:
